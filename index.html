<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cotizador Pro - Software a Medida (iPhone 16)</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ios-bg: #F2F2F7;
            --ios-card: #FFFFFF;
            --ios-primary: #007AFF;
            --ios-success: #34C759;
            --ios-warning: #FF9500;
            --ios-danger: #FF3B30;
            --ios-text: #1C1C1E;
            --ios-gray: #8E8E93;
            --ios-border: #C6C6C8;
        }

        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #111;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* iPhone 16 Frame Container (393px × 852px viewport exact approx) */
        .iphone-container {
            width: 393px;
            height: 852px;
            background-color: var(--ios-bg);
            border-radius: 50px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6), inset 0 0 0 12px #2c2c2e;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Dynamic Island simulation */
        .dynamic-island {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 32px;
            background-color: #000;
            border-radius: 20px;
            z-index: 1050;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            color: #fff;
            font-size: 11px;
        }

        /* App Screen Area */
        .app-screen {
            flex: 1;
            margin-top: 48px; /* space for island */
            margin-bottom: 34px; /* space for home indicator */
            overflow-y: auto;
            position: relative;
            background-color: var(--ios-bg);
        }

        .app-screen::-webkit-scrollbar {
            width: 4px;
        }
        .app-screen::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
        }

        /* Home Indicator bar */
        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 134px;
            height: 5px;
            background-color: #000;
            border-radius: 100px;
            z-index: 1050;
            pointer-events: none;
        }

        /* Bottom Nav Bar */
        .ios-tabbar {
            height: 60px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--ios-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1040;
            padding-bottom: 10px;
        }

        .tab-item {
            color: var(--ios-gray);
            text-align: center;
            font-size: 10px;
            text-decoration: none;
            flex: 1;
            transition: color 0.2s;
        }

        .tab-item.active {
            color: var(--ios-primary);
        }

        .tab-item i {
            font-size: 20px;
            display: block;
            margin-bottom: 2px;
        }

        /* UI Component Enhancements */
        .ios-card {
            background: var(--ios-card);
            border-radius: 16px;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .badge-draft { background-color: #e5e5ea; color: #3a3a3c; }
        .badge-sent { background-color: #007aff22; color: #007aff; }
        .badge-approved { background-color: #34c75922; color: #34c759; }
        .badge-rejected { background-color: #ff3b3022; color: #ff3b30; }
        .badge-expired { background-color: #ff950022; color: #ff9500; }

        /* Print Styles for Executive PDF format */
        @media print {
            body {
                background: white !important;
                display: block !important;
            }
            .iphone-container {
                width: 100% !important;
                height: auto !important;
                box-shadow: none !important;
                border-radius: 0 !important;
                overflow: visible !important;
            }
            .dynamic-island, .home-indicator, .ios-tabbar, .no-print {
                display: none !important;
            }
            .app-screen {
                margin: 0 !important;
                overflow: visible !important;
                background: white !important;
            }
            .print-container {
                display: block !important;
                padding: 20px !important;
                color: #000 !important;
            }
        }
    </style>
</head>
<body>

    <div class="iphone-container">
        <!-- Dynamic Island -->
        <div class="dynamic-island">
            <span class="fw-bold text-white" style="font-size: 11px;"><i class="bi bi-code-slash text-info"></i> DevQuotes</span>
            <span id="clock" class="text-secondary" style="font-size: 10px;">1:35</span>
        </div>

        <!-- Main Screen Content Area -->
        <div class="app-screen" id="appScreen">
            <!-- Dynamic views get injected here -->
        </div>

        <!-- Bottom Tab Bar -->
        <div class="ios-tabbar no-print" id="iosTabbar">
            <a href="#" class="tab-item active" onclick="switchTab('dashboard', event)">
                <i class="bi bi-house-door-fill"></i>
                Inicio
            </a>
            <a href="#" class="tab-item" onclick="switchTab('quotes', event)">
                <i class="bi bi-file-earmark-text-fill"></i>
                Cotizaciones
            </a>
            <a href="#" class="tab-item" onclick="switchTab('newQuote', event)">
                <i class="bi bi-plus-circle-fill" style="font-size: 24px; color: var(--ios-primary);"></i>
                Crear
            </a>
            <a href="#" class="tab-item" onclick="switchTab('reports', event)">
                <i class="bi bi-bar-chart-fill"></i>
                Reportes
            </a>
            <a href="#" class="tab-item" onclick="switchTab('settings', event)">
                <i class="bi bi-gear-fill"></i>
                Ajustes
            </a>
        </div>

        <!-- Home Indicator -->
        <div class="home-indicator"></div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const DEFAULT_CATALOG = [
            {
                id: 'mod_auth',
                name: 'Autenticación & Seguridad',
                description: 'Login social, JWT, roles (Admin/Cliente), recuperación.',
                price: 2500,
                screens: ['Login / Registro', 'Recuperación de Contraseña', 'Gestión de Perfil', 'Control de Roles RBAC'],
                userStories: [
                    'Como usuario quiero iniciar sesión con Google o Email para acceder a la plataforma.',
                    'Como administrador quiero asignar permisos granulares por rol para proteger endpoints.'
                ]
            },
            {
                id: 'mod_dash',
                name: 'Dashboard Ejecutivo & Analítica',
                description: 'Gráficos interactivos, métricas clave en tiempo real, exportación.',
                price: 3800,
                screens: ['Vista General KPI', 'Gráficos de Rendimiento', 'Exportación CSV/Excel', 'Filtros por Rango de Fecha'],
                userStories: [
                    'Como gerente quiero visualizar KPIs clave en tiempo real para tomar decisiones.',
                    'Como analista quiero filtrar métricas por periodos específicos.'
                ]
            },
            {
                id: 'mod_users',
                name: 'Gestión Avanzada de Usuarios',
                description: 'CRUD completo de usuarios, auditoría, estados de cuenta y accesos.',
                price: 2200,
                screens: ['Listado de Usuarios', 'Ficha de Usuario', 'Registro de Auditoría / Logs', 'Bloqueo/Activación de Cuentas'],
                userStories: [
                    'Como administrador quiero buscar y filtrar usuarios rápidamente.',
                    'Como auditor quiero revisar el registro de accesos y cambios realizados.'
                ]
            },
            {
                id: 'mod_pay',
                name: 'Pasarela de Pagos (Bolivia/Internacional)',
                description: 'Integración QR Pagosnet/BCP, tarjetas de crédito, facturación electrónica.',
                price: 4500,
                screens: ['Checkout Carrito / Servicios', 'Generación de QR Dinámico', 'Historial de Transacciones', 'Webhook & Confirmación'],
                userStories: [
                    'Como cliente quiero pagar de forma segura escaneando un código QR en Bolivianos.',
                    'Como administrador quiero verificar el estado de las transacciones en tiempo real.'
                ]
            },
            {
                id: 'mod_api',
                name: 'API REST & Backend Escalable',
                description: 'Arquitectura Node.js/Python, documentación Swagger, base de datos optimizada.',
                price: 5000,
                screens: ['Documentación Swagger UI', 'Panel de Endpoints', 'Gestión de Tokens API', 'Monitoreo de Salud Server'],
                userStories: [
                    'Como desarrollador frontend quiero consumir endpoints documentados y seguros.',
                    'Como DevOps quiero monitorear el rendimiento y uptime de la API.'
                ]
            },
            {
                id: 'mod_app',
                name: 'App Móvil Nativa/Cross-Platform',
                description: 'Aplicación en React Native / Flutter para iOS y Android.',
                price: 7500,
                screens: ['Pantalla de Bienvenida (Splash)', 'Onboarding Interactivo', 'Notificaciones Push', 'Configuración de Ajustes App'],
                userStories: [
                    'Como usuario móvil quiero recibir notificaciones push de alertas importantes.',
                    'Como cliente quiero navegar fluidamente en la app desde mi celular.'
                ]
            }
        ];

        // Load initial state from LocalStorage or seed defaults
        let appData = {
            quotes: JSON.parse(localStorage.getItem('dev_quotes_v1')) || [
                {
                    id: 'COT-2026-001',
                    clientName: 'Banco Progresivo S.A.',
                    clientNit: '1029384019',
                    clientEmail: 'contacto@bancoprogresivo.bo',
                    dateEmission: '2026-03-01',
                    dateExpiry: '2026-04-01',
                    status: 'Aprobada',
                    discountPercent: 5,
                    taxPercent: 13, // IVA Bolivia
                    modules: [
                        { ...DEFAULT_CATALOG[0], customPrice: 2500 },
                        { ...DEFAULT_CATALOG[1], customPrice: 3800 },
                        { ...DEFAULT_CATALOG[3], customPrice: 4500 }
                    ],
                    notes: 'Incluye soporte técnico por 6 meses y capacitación al personal.'
                },
                {
                    id: 'COT-2026-002',
                    clientName: 'Agro10 Santa Cruz',
                    clientNit: '4928174011',
                    clientEmail: 'sistemas@agro10.bo',
                    dateEmission: '2026-03-10',
                    dateExpiry: '2026-03-25',
                    status: 'Enviada',
                    discountPercent: 0,
                    taxPercent: 13,
                    modules: [
                        { ...DEFAULT_CATALOG[1], customPrice: 3800 },
                        { ...DEFAULT_CATALOG[2], customPrice: 2200 }
                    ],
                    notes: 'Desarrollo ágil en sprints de 2 semanas.'
                }
            ],
            catalog: JSON.parse(localStorage.getItem('dev_catalog_v1')) || DEFAULT_CATALOG
        };

        function saveState() {
            localStorage.setItem('dev_quotes_v1', JSON.stringify(appData.quotes));
            localStorage.setItem('dev_catalog_v1', JSON.stringify(appData.catalog));
        }

        // Active screen router state
        let currentTab = 'dashboard';
        let editingQuoteId = null;
        let previewingQuoteId = null;

        // Temporary builder state for New/Edit quote
        let builderModules = [];

        // Clock updater
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }, 1000);

        function switchTab(tab, event) {
            if(event) event.preventDefault();
            currentTab = tab;
            
            // Update Tab bar UI
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            if(tab === 'dashboard') document.querySelectorAll('.tab-item')[0].classList.add('active');
            if(tab === 'quotes') document.querySelectorAll('.tab-item')[1].classList.add('active');
            if(tab === 'newQuote') {
                document.querySelectorAll('.tab-item')[2].classList.add('active');
                initQuoteBuilder();
            }
            if(tab === 'reports') document.querySelectorAll('.tab-item')[3].classList.add('active');
            if(tab === 'settings') document.querySelectorAll('.tab-item')[4].classList.add('active');

            renderScreen();
        }

        function renderScreen() {
            const screen = document.getElementById('appScreen');
            screen.innerHTML = '';

            switch(currentTab) {
                case 'dashboard':
                    screen.innerHTML = getDashboardHTML();
                    break;
                case 'quotes':
                    screen.innerHTML = getQuotesListHTML();
                    break;
                case 'newQuote':
                    screen.innerHTML = getQuoteBuilderHTML();
                    setupBuilderEvents();
                    break;
                case 'reports':
                    screen.innerHTML = getReportsHTML();
                    break;
                case 'settings':
                    screen.innerHTML = getSettingsHTML();
                    break;
                case 'preview':
                    screen.innerHTML = getQuotePreviewHTML(previewingQuoteId);
                    break;
            }
        }

        // --- 1. DASHBOARD VIEW ---
        function getDashboardHTML() {
            const totalQuotes = appData.quotes.length;
            const totalAmount = appData.quotes.reduce((acc, q) => acc + calculateQuoteTotal(q).total, 0);
            const activeQuotes = appData.quotes.filter(q => q.status === 'Enviada' || q.status === 'Aprobada').length;
            
            const today = new Date().toISOString().split('T')[0];
            const expiredQuotes = appData.quotes.filter(q => q.dateExpiry < today && q.status !== 'Aprobada' && q.status !== 'Rechazada').length;

            let recentHTML = appData.quotes.slice(-3).reverse().map(q => {
                const totals = calculateQuoteTotal(q);
                return `
                    <div class="ios-card p-3 mb-2 cursor-pointer" onclick="openPreview('${q.id}')">
                        <div class="d-flex justify-content-between align-items-start mb-1">
                            <div>
                                <span class="fw-bold text-dark" style="font-size: 13px;">${q.id}</span>
                                <div class="text-secondary" style="font-size: 11px;">${q.clientName}</div>
                            </div>
                            <span class="badge ${getStatusBadgeClass(q.status)}" style="font-size: 10px;">${q.status}</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top">
                            <span class="text-muted" style="font-size: 11px;">Vence: ${q.dateExpiry}</span>
                            <span class="fw-bold text-primary" style="font-size: 13px;">Bs. ${totals.total.toLocaleString('es-BO', {minimumFractionDigits: 2})}</span>
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="p-3">
                    <!-- Header Profile -->
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div>
                            <div class="text-secondary" style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;">Dashboard Ejecutivo</div>
                            <h5 class="fw-bold m-0 text-dark">Software Quotes</h5>
                        </div>
                        <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width: 36px; height: 36px; font-size: 14px;">
                            BO
                        </div>
                    </div>

                    <!-- Quick Metrics Grid -->
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <div class="ios-card p-3">
                                <div class="text-secondary mb-1" style="font-size: 11px;"><i class="bi bi-file-earmark-text"></i> Total Cotizado</div>
                                <h4 class="fw-bold text-dark mb-0" style="font-size: 16px;">Bs. ${totalAmount.toLocaleString('es-BO', {maximumFractionDigits: 0})}</h4>
                                <span class="text-muted" style="font-size: 9px;">${totalQuotes} cotizaciones registradas</span>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="ios-card p-3">
                                <div class="text-secondary mb-1" style="font-size: 11px;"><i class="bi bi-activity"></i> Activas / Vigentes</div>
                                <h4 class="fw-bold text-success mb-0" style="font-size: 16px;">${activeQuotes}</h4>
                                <span class="text-muted" style="font-size: 9px;">${expiredQuotes} vencidas pendientes</span>
                            </div>
                        </div>
                    </div>

                    <!-- Quick Action Banner -->
                    <div class="ios-card p-3 mb-3 bg-gradient text-white position-relative overflow-hidden" style="background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);">
                        <div style="position: relative; z-index: 2;">
                            <h6 class="fw-bold mb-1" style="font-size: 14px;">Nueva Propuesta a Medida</h6>
                            <p class="text-white-50 mb-2" style="font-size: 11px;">Selecciona módulos, define pantallas e historias de usuario en Bolivianos.</p>
                            <button class="btn btn-light btn-sm fw-semibold px-3 py-1 rounded-pill text-primary" style="font-size: 11px;" onclick="switchTab('newQuote')">
                                <i class="bi bi-plus-lg"></i> Crear Cotización
                            </button>
                        </div>
                    </div>

                    <!-- Recent Quotes -->
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6 class="fw-bold text-dark mb-0" style="font-size: 13px;">Cotizaciones Recientes</h6>
                        <a href="#" class="text-primary text-decoration-none" style="font-size: 11px;" onclick="switchTab('quotes')">Ver todas</a>
                    </div>
                    <div>
                        ${recentHTML || '<p class="text-muted text-center py-3" style="font-size: 12px;">No hay cotizaciones aún.</p>'}
                    </div>
                </div>
            `;
        }

        // --- 2. QUOTES LIST VIEW ---
        function getQuotesListHTML() {
            const searchTerm = document.getElementById('searchQuoteInput')?.value?.toLowerCase() || '';
            const statusFilter = document.getElementById('statusFilterSelect')?.value || 'ALL';

            const filtered = appData.quotes.filter(q => {
                const matchSearch = q.clientName.toLowerCase().includes(searchTerm) || q.id.toLowerCase().includes(searchTerm);
                const matchStatus = statusFilter === 'ALL' || q.status === statusFilter;
                return matchSearch && matchStatus;
            });

            let listHTML = filtered.map(q => {
                const totals = calculateQuoteTotal(q);
                return `
                    <div class="ios-card p-3 mb-2">
                        <div class="d-flex justify-content-between align-items-start mb-1">
                            <div>
                                <span class="fw-bold text-primary" style="font-size: 13px;">${q.id}</span>
                                <h6 class="fw-bold text-dark mb-0" style="font-size: 14px;">${q.clientName}</h6>
                                <span class="text-secondary" style="font-size: 11px;">NIT: ${q.clientNit || 'S/N'}</span>
                            </div>
                            <span class="badge ${getStatusBadgeClass(q.status)}" style="font-size: 10px;">${q.status}</span>
                        </div>
                        <div class="my-2 text-secondary" style="font-size: 11px;">
                            <div><i class="bi bi-calendar-event"></i> Emisión: ${q.dateEmission} | Vence: <span class="${q.dateExpiry < new Date().toISOString().split('T')[0] && q.status !== 'Aprobada' ? 'text-danger fw-bold' : ''}">${q.dateExpiry}</span></div>
                            <div><i class="bi bi-layers"></i> ${q.modules.length} Módulos configurados</div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                            <div>
                                <span class="text-muted" style="font-size: 10px;">TOTAL BOB</span>
                                <div class="fw-bold text-dark" style="font-size: 14px;">Bs. ${totals.total.toLocaleString('es-BO', {minimumFractionDigits: 2})}</div>
                            </div>
                            <div class="btn-group btn-group-sm">
                                <button class="btn btn-outline-secondary py-1 px-2" style="font-size: 11px;" onclick="openPreview('${q.id}')" title="Ver / Imprimir">
                                    <i class="bi bi-printer"></i>
                                </button>
                                <button class="btn btn-outline-primary py-1 px-2" style="font-size: 11px;" onclick="editQuote('${q.id}')" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-outline-danger py-1 px-2" style="font-size: 11px;" onclick="deleteQuote('${q.id}')" title="Eliminar">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="p-3">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold m-0 text-dark">Gestión de Cotizaciones</h5>
                        <button class="btn btn-primary btn-sm rounded-pill px-3" style="font-size: 11px;" onclick="switchTab('newQuote')">
                            <i class="bi bi-plus-lg"></i> Nueva
                        </button>
                    </div>

                    <!-- Search and Filters -->
                    <div class="mb-3">
                        <div class="input-group input-group-sm mb-2">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                            <input type="text" id="searchQuoteInput" class="form-control border-start-0" placeholder="Buscar por cliente o código..." value="${searchTerm}" oninput="renderScreen()">
                        </div>
                        <select id="statusFilterSelect" class="form-select form-select-sm" onchange="renderScreen()">
                            <option value="ALL" ${statusFilter==='ALL'?'selected':''}>Todos los estados</option>
                            <option value="Borrador" ${statusFilter==='Borrador'?'selected':''}>Borrador</option>
                            <option value="Enviada" ${statusFilter==='Enviada'?'selected':''}>Enviada</option>
                            <option value="Aprobada" ${statusFilter==='Aprobada'?'selected':''}>Aprobada</option>
                            <option value="Rechazada" ${statusFilter==='Rechazada'?'selected':''}>Rechazada</option>
                        </select>
                    </div>

                    <div class="quotes-list">
                        ${listHTML || '<div class="text-center py-5 text-muted" style="font-size: 12px;">No se encontraron cotizaciones.</div>'}
                    </div>
                </div>
            `;
        }

        // --- 3. QUOTE BUILDER & EDITOR VIEW ---
        function initQuoteBuilder() {
            if(!editingQuoteId) {
                // Generate next code
                const count = appData.quotes.length + 1;
                const code = `COT-2026-${String(count).padStart(3, '0')}`;
                
                const today = new Date().toISOString().split('T')[0];
                const expiry = new Date(Date.now() + 30*24*60*60*1000).toISOString().split('T')[0];

                window.currentBuilder = {
                    id: code,
                    clientName: '',
                    clientNit: '',
                    clientEmail: '',
                    dateEmission: today,
                    dateExpiry: expiry,
                    status: 'Borrador',
                    discountPercent: 0,
                    taxPercent: 13, // IVA 13% Bolivia
                    modules: [],
                    notes: 'Forma de pago: 50% anticipo, 50% contra entrega de software funcionando.'
                };
            }
        }

        function getQuoteBuilderHTML() {
            const b = window.currentBuilder;
            let selectedModulesHTML = b.modules.map((m, idx) => `
                <div class="ios-card p-3 mb-2 border border-light">
                    <div class="d-flex justify-content-between align-items-start mb-1">
                        <div>
                            <span class="badge bg-secondary mb-1" style="font-size: 9px;">Módulo #${idx+1}</span>
                            <h6 class="fw-bold text-dark mb-0" style="font-size: 13px;">${m.name}</h6>
                        </div>
                        <button class="btn btn-sm text-danger p-0" onclick="removeBuilderModule(${idx})"><i class="bi bi-x-circle-fill" style="font-size: 16px;"></i></button>
                    </div>

        function setupBuilderEvents() {
            // Bind input changes to window.currentBuilder
            document.getElementById('builderClientName')?.addEventListener('input', e => window.currentBuilder.clientName = e.target.value);
            document.getElementById('builderClientNit')?.addEventListener('input', e => window.currentBuilder.clientNit = e.target.value);
            document.getElementById('builderClientEmail')?.addEventListener('input', e => window.currentBuilder.clientEmail = e.target.value);
            document.getElementById('builderDateEmission')?.addEventListener('change', e => window.currentBuilder.dateEmission = e.target.value);
            document.getElementById('builderDateExpiry')?.addEventListener('change', e => window.currentBuilder.dateExpiry = e.target.value);
            document.getElementById('builderStatus')?.addEventListener('change', e => window.currentBuilder.status = e.target.value);
            document.getElementById('builderNotes')?.addEventListener('input', e => window.currentBuilder.notes = e.target.value);
        }

        function addModuleFromCatalog() {
            const select = document.getElementById('catalogSelector');
            const catId = select.value;
            if(!catId) return;

            const catalogItem = appData.catalog.find(c => c.id === catId);
            if(catalogItem) {
                window.currentBuilder.modules.push({
                    ...catalogItem,
                    customPrice: catalogItem.price
                });
                renderScreen();
            }
        }

        function removeModuleFromBuilder(idx) {
            window.currentBuilder.modules.splice(idx, 1);
            renderScreen();
        }

        function updateModulePrice(idx, val) {
            window.currentBuilder.modules[idx].customPrice = parseFloat(val) || 0;
            renderScreen();
        }

        function updateBuilderFinancials() {
            window.currentBuilder.discountPercent = parseFloat(document.getElementById('builderDiscount').value) || 0;
            window.currentBuilder.taxPercent = parseFloat(document.getElementById('builderTax').value) || 0;
            renderScreen();
        }

        function openCustomModuleModal() {
            document.getElementById('customModuleModal').classList.remove('d-none');
            document.getElementById('customModuleModal').classList.add('d-flex');
        }

        function closeCustomModuleModal() {
            document.getElementById('customModuleModal').classList.remove('d-flex');
            document.getElementById('customModuleModal').classList.add('d-none');
        }

        function saveCustomModule() {
            const name = document.getElementById('cmName').value;
            const desc = document.getElementById('cmDesc').value;
            const price = parseFloat(document.getElementById('cmPrice').value) || 0;
            const screens = document.getElementById('cmScreens').value.split(',').map(s => s.trim()).filter(Boolean);
            const stories = document.getElementById('cmStories').value.split(';').map(s => s.trim()).filter(Boolean);

            if(!name) {
                alert('El nombre del módulo es obligatorio.');
                return;
            }

            window.currentBuilder.modules.push({
                id: 'custom_' + Date.now(),
                name,
                description: desc || 'Módulo personalizado a medida',
                price,
                customPrice: price,
                screens: screens.length ? screens : ['Pantalla Principal'],
                userStories: stories.length ? stories : ['Como usuario quiero utilizar este módulo personalizado.']
            });

            closeCustomModuleModal();
            renderScreen();
        }

        function saveCurrentQuote() {
            const b = window.currentBuilder;
            if(!b.clientName.trim()) {
                alert('Por favor ingrese el nombre o razón social del cliente.');
                return;
            }
            if(b.modules.length === 0) {
                alert('Debe agregar al menos un módulo de software a la cotización.');
                return;
            }

            // Check if editing or new
            const existingIdx = appData.quotes.findIndex(q => q.id === b.id);
            if(existingIdx >= 0) {
                appData.quotes[existingIdx] = { ...b };
            } else {
                appData.quotes.push({ ...b });
            }

            saveState();
            editingQuoteId = null;
            switchTab('quotes');
        }

        function editQuote(id) {
            const q = appData.quotes.find(item => item.id === id);
            if(q) {
                editingQuoteId = id;
                window.currentBuilder = JSON.parse(JSON.stringify(q)); // Deep clone
                currentTab = 'newQuote';
                renderScreen();
            }
        }

        function deleteQuote(id) {
            if(confirm(`¿Está seguro de eliminar la cotización ${id}?`)) {
                appData.quotes = appData.quotes.filter(q => q.id !== id);
                saveState();
                renderScreen();
            }
        }

                        <div class="border-top pt-2">
                            <h6 class="fw-bold text-dark mb-2" style="font-size: 11px;">Agregar Nuevo Módulo al Catálogo</h6>
                            <div class="mb-2">
                                <input type="text" id="catNewName" class="form-control form-control-sm mb-1" placeholder="Nombre módulo estándar">
                                <input type="text" id="catNewDesc" class="form-control form-control-sm mb-1" placeholder="Descripción corta">
                                <input type="number" id="catNewPrice" class="form-control form-control-sm mb-1" placeholder="Precio Base (BOB)">
                            </div>
                            <button class="btn btn-primary btn-sm w-100" style="font-size: 11px;" onclick="addCatalogItem()"><i class="bi bi-plus-lg"></i> Guardar en Catálogo</button>
                        </div>
                    </div>

                    <div class="ios-card p-3 mb-3 text-center">
                        <h6 class="fw-bold text-danger mb-2" style="font-size: 12px;">Zona de Datos</h6>
                        <button class="btn btn-outline-danger btn-sm w-100" style="font-size: 11px;" onclick="resetDemoData()">
                            <i class="bi bi-arrow-counterclockwise"></i> Restaurar Datos de Demostración
                        </button>
                    </div>
                </div>
            `;
        }

        function addCatalogItem() {
            const name = document.getElementById('catNewName').value;
            const desc = document.getElementById('catNewDesc').value;
            const price = parseFloat(document.getElementById('catNewPrice').value) || 0;

            if(!name) {
                alert('Ingrese el nombre del módulo.');
                return;
            }

            appData.catalog.push({
                id: 'cat_' + Date.now(),
                name,
                description: desc || 'Módulo estándar',
                price,
                screens: ['Pantalla Principal', 'Detalle y Gestión'],
                userStories: ['Como usuario quiero interactuar con este módulo estándar.']
            });

            saveState();
            renderScreen();
        }

        function deleteCatalogItem(id) {
            appData.catalog = appData.catalog.filter(c => c.id !== id);
            saveState();
            renderScreen();
        }

        function resetDemoData() {
            if(confirm('¿Restaurar datos iniciales? Se perderán cotizaciones creadas.')) {
                localStorage.removeItem('dev_quotes_v1');
                localStorage.removeItem('dev_catalog_v1');
                location.reload();
            }
        }

        // --- HELPER CALCULATOR ---
        function calculateQuoteTotal(q) {
            const subtotal = q.modules.reduce((acc, m) => acc + (m.customPrice !== undefined ? m.customPrice : m.price), 0);
            const discountAmount = subtotal * ((q.discountPercent || 0) / 100);
            const taxable = subtotal - discountAmount;
            const taxAmount = taxable * ((q.taxPercent || 0) / 100);
            const total = taxable + taxAmount;
            return { subtotal, discountAmount, taxAmount, total };
        }

        function getStatusBadgeClass(status) {
            switch(status) {
                case 'Borrador': return 'badge-draft';
                case 'Enviada': return 'badge-sent';
                case 'Aprobada': return 'badge-approved';
                case 'Rechazada': return 'badge-rejected';
                case 'Vencida': return 'badge-expired';
                default: return 'badge-draft';
            }
        }

        // Initial Boot
        window.onload = function() {
            renderScreen();
        };
    </script>
</body>
</html>
