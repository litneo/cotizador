<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cotizador Pro - Software a Medida (BOB)</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --app-bg: #F8FAFC;
            --app-card: #FFFFFF;
            --app-primary: #0D6EFD;
            --app-text: #1E293B;
            --app-border: #E2E8F0;
        }

        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--app-bg);
            color: var(--app-text);
            margin: 0;
            padding: 0;
        }

        /* Full Responsive Minimalist Layout Container */
        .main-container {
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: var(--app-bg);
            position: relative;
            padding-bottom: 80px;
        }

        .ios-card {
            background: var(--app-card);
            border-radius: 16px;
            border: 1px solid var(--app-border);
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        /* Bottom Tab Bar */
        .ios-tabbar {
            height: 65px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--app-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 600px;
            margin: 0 auto;
            z-index: 1040;
            padding-bottom: 8px;
        }

        .tab-item {
            color: #64748B;
            text-align: center;
            font-size: 11px;
            text-decoration: none;
            flex: 1;
            transition: color 0.2s;
        }

        .tab-item.active {
            color: var(--app-primary);
            font-weight: 600;
        }

        .tab-item i {
            font-size: 20px;
            display: block;
            margin-bottom: 2px;
        }

        .badge-draft { background-color: #F1F5F9; color: #475569; }
        .badge-sent { background-color: #DBEAFE; color: #1D4ED8; }
        .badge-approved { background-color: #DCFCE7; color: #15803D; }
        .badge-rejected { background-color: #FEE2E2; color: #B91C1C; }

        /* Print Styles for Executive PDF format */
        @media print {
            body {
                background: white !important;
            }
            .main-container {
                max-width: 100% !important;
                padding: 0 !important;
            }
            .ios-tabbar, .no-print {
                display: none !important;
            }
            .print-container {
                display: block !important;
                padding: 10px !important;
                color: #000 !important;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Top App Header -->
        <header class="bg-white border-bottom px-3 py-3 sticky-top d-flex justify-content-between align-items-center no-print" style="z-index: 1030;">
            <div>
                <h1 id="headerCompanyName" class="fw-bold m-0 text-dark" style="font-size: 15px;">Mi Empresa de Software</h1>
                <span id="headerCompanyNit" class="text-muted" style="font-size: 11px;">NIT: 000000000</span>
            </div>
            <span class="badge bg-primary bg-opacity-15 text-primary px-2.5 py-1 rounded-pill" style="font-size: 11px; font-weight: 600;">BOB (Bs.)</span>
        </header>

        <!-- Main Screen Content Area -->
        <main class="p-3" id="appScreen">
            <!-- Dynamic views injected here -->
        </main>

        <!-- Bottom Tab Bar -->
        <nav class="ios-tabbar no-print" id="iosTabbar">
            <a href="#" class="tab-item active" onclick="switchTab('dashboard', event)">
                <i class="bi bi-house-door-fill"></i>
                Inicio
            </a>
            <a href="#" class="tab-item" onclick="switchTab('quotes', event)">
                <i class="bi bi-file-earmark-text-fill"></i>
                Cotizaciones
            </a>
            <a href="#" class="tab-item" onclick="switchTab('newQuote', event)">
                <i class="bi bi-plus-circle-fill" style="font-size: 24px; color: var(--app-primary);"></i>
                Crear
            </a>
            <a href="#" class="tab-item" onclick="switchTab('reports', event)">
                <i class="bi bi-bar-chart-fill"></i>
                Reportes
            </a>
            <a href="#" class="tab-item" onclick="switchTab('settings', event)">
                <i class="bi bi-gear-fill"></i>
                Ajustes
            </a>
        </nav>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // FIXED CATALOG (Non-editable modules, with standard screens and user stories)
        const FIXED_CATALOG = [
            {
                id: 'mod_auth',
                name: 'Autenticación & Seguridad Avanzada',
                description: 'Login social, JWT, roles (Admin/Cliente), recuperación de contraseña.',
                price: 2500,
                screens: ['Login / Registro', 'Recuperación de Contraseña', 'Gestión de Perfil', 'Control de Roles RBAC'],
                userStories: [
                    'Como usuario quiero iniciar sesión con Google o Email para acceder a la plataforma.',
                    'Como administrador quiero asignar permisos granulares por rol para proteger endpoints.'
                ]
            },
            {
                id: 'mod_dash',
                name: 'Dashboard Ejecutivo & Analítica',
                description: 'Gráficos interactivos, métricas clave en tiempo real, exportación de datos.',
                price: 3800,
                screens: ['Vista General KPI', 'Gráficos de Rendimiento', 'Exportación CSV/Excel', 'Filtros por Fecha'],
                userStories: [
                    'Como gerente quiero visualizar KPIs clave en tiempo real para tomar decisiones.',
                    'Como analista quiero filtrar métricas por periodos específicos.'
                ]
            },
            {
                id: 'mod_users',
                name: 'Gestión Integral de Usuarios',
                description: 'CRUD completo de usuarios, auditoría, estados de cuenta y accesos.',
                price: 2200,
                screens: ['Listado de Usuarios', 'Ficha de Usuario', 'Registro de Auditoría', 'Bloqueo/Activación'],
                userStories: [
                    'Como administrador quiero buscar y filtrar usuarios rápidamente.',
                    'Como auditor quiero revisar el registro de accesos y cambios realizados.'
                ]
            },
            {
                id: 'mod_pay',
                name: 'Pasarela de Pagos QR & Facturación',
                description: 'Integración QR Pagosnet/BCP, tarjetas de crédito y control transaccional.',
                price: 4500,
                screens: ['Checkout Carrito', 'Generación de QR Dinámico', 'Historial Transacciones', 'Confirmación Webhook'],
                userStories: [
                    'Como cliente quiero pagar de forma segura escaneando un código QR en Bolivianos.',
                    'Como administrador quiero verificar el estado de las transacciones en tiempo real.'
                ]
            },
            {
                id: 'mod_api',
                name: 'API REST & Backend Escalable',
                description: 'Arquitectura Node.js/Python, documentación Swagger, base de datos optimizada.',
                price: 5000,
                screens: ['Documentación Swagger UI', 'Panel de Endpoints', 'Gestión de Tokens API', 'Monitoreo Server'],
                userStories: [
                    'Como desarrollador frontend quiero consumir endpoints documentados y seguros.',
                    'Como DevOps quiero monitorear el rendimiento y uptime de la API.'
                ]
            }
        ];

        // Default Company Settings
        const DEFAULT_SETTINGS = {
            companyName: 'DevStudio Bolivia S.R.L.',
            companyNit: 'NIT: 2049182010',
            companyPhone: '+591 70000000',
            companyEmail: 'contacto@devstudio.bo'
        };

        // Load state from localStorage
        let appData = {
            settings: JSON.parse(localStorage.getItem('dev_settings_v2')) || DEFAULT_SETTINGS,
            quotes: JSON.parse(localStorage.getItem('dev_quotes_v2')) || [
                {
                    id: 'COT-2026-001',
                    clientName: 'Banco Progresivo S.A.',
                    clientNit: '1029384019',
                    clientEmail: 'contacto@bancoprogresivo.bo',
                    dateEmission: '2026-03-01',
                    dateExpiry: '2026-04-01',
                    status: 'Aprobada',
                    discountPercent: 5,
                    modules: [
                        { ...FIXED_CATALOG[0], customPrice: 2500 },
                        { ...FIXED_CATALOG[1], customPrice: 3800 },
                        { ...FIXED_CATALOG[3], customPrice: 4500 }
                    ],
                    notes: 'Incluye soporte técnico por 6 meses y capacitación al personal.'
                }
            ]
        };

        function saveState() {
            localStorage.setItem('dev_quotes_v2', JSON.stringify(appData.quotes));
            localStorage.setItem('dev_settings_v2', JSON.stringify(appData.settings));
        }

        let currentTab = 'dashboard';
        let editingQuoteId = null;
        let previewingQuoteId = null;
        let windowBuilder = null;

        // Requirement: Clear text/number box when focused if empty or 0
        document.addEventListener('focusin', function(e) {
            if (e.target.matches('input[type="number"], input[type="text"]')) {
                if (e.target.value === '0' || e.target.value === '0.00' || e.target.value === '') {
                    // Only clear if it's zero or empty placeholder state
                }
            }
        });
        
        document.addEventListener('focus', function(e) {
            if (e.target.tagName === 'INPUT' && (e.target.value === '0' || e.target.value === '0.00')) {
                e.target.value = '';
            }
        }, true);

        window.onload = function() {
            updateHeaderDisplay();
            renderScreen();
        };

        function updateHeaderDisplay() {
            document.getElementById('headerCompanyName').innerText = appData.settings.companyName;
            document.getElementById('headerCompanyNit').innerText = appData.settings.companyNit;
        }

        function switchTab(tab, event) {
            if(event) event.preventDefault();
            currentTab = tab;
            
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            if(tab === 'dashboard') document.querySelectorAll('.tab-item')[0].classList.add('active');
            if(tab === 'quotes') document.querySelectorAll('.tab-item')[1].classList.add('active');
            if(tab === 'newQuote') {
                document.querySelectorAll('.tab-item')[2].classList.add('active');
                initQuoteBuilder();
            }
            if(tab === 'reports') document.querySelectorAll('.tab-item')[3].classList.add('active');
            if(tab === 'settings') document.querySelectorAll('.tab-item')[4].classList.add('active');

            renderScreen();
        }

        function renderScreen() {
            const screen = document.getElementById('appScreen');
            screen.innerHTML = '';

            switch(currentTab) {
                case 'dashboard':
                    screen.innerHTML = getDashboardHTML();
                    break;
                case 'quotes':
                    screen.innerHTML = getQuotesListHTML();
                    break;
                case 'newQuote':
                    screen.innerHTML = getQuoteBuilderHTML();
                    setupBuilderEvents();
                    break;
                case 'reports':
                    screen.innerHTML = getReportsHTML();
                    break;
                case 'settings':
                    screen.innerHTML = getSettingsHTML();
                    break;
                case 'preview':
                    screen.innerHTML = getQuotePreviewHTML(previewingQuoteId);
                    break;
            }
        }

        // --- DASHBOARD ---
        function getDashboardHTML() {
            const totalQuotes = appData.quotes.length;
            const totalAmount = appData.quotes.reduce((acc, q) => acc + calculateQuoteTotal(q).total, 0);
            const activeQuotes = appData.quotes.filter(q => q.status === 'Enviada' || q.status === 'Aprobada').length;
            const today = new Date().toISOString().split('T')[0];
            const expiredQuotes = appData.quotes.filter(q => q.dateExpiry < today && q.status !== 'Aprobada').length;

            let recentHTML = appData.quotes.slice(-3).reverse().map(q => {
                const totals = calculateQuoteTotal(q);
                return `
                    <div class="ios-card p-3 mb-2" onclick="openPreview('${q.id}')" style="cursor: pointer;">
                        <div class="d-flex justify-content-between align-items-start mb-1">
                            <div>
                                <span class="fw-bold text-dark" style="font-size: 13px;">${q.id}</span>
                                <div class="text-secondary" style="font-size: 11px;">${q.clientName}</div>
                            </div>
                            <span class="badge ${getStatusBadgeClass(q.status)}" style="font-size: 10px;">${q.status}</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top">
                            <span class="text-muted" style="font-size: 11px;">Vence: ${q.dateExpiry}</span>
                            <span class="fw-bold text-primary" style="font-size: 13px;">Bs. ${totals.total.toLocaleString('es-BO', {minimumFractionDigits: 2})}</span>
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="p-1">
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <div class="ios-card p-3">
                                <div class="text-secondary mb-1" style="font-size: 11px;"><i class="bi bi-file-earmark-text"></i> Total Cotizado</div>
                                <h4 class="fw-bold text-dark mb-0" style="font-size: 16px;">Bs. ${totalAmount.toLocaleString('es-BO', {maximumFractionDigits: 0})}</h4>
                                <span class="text-muted" style="font-size: 9px;">${totalQuotes} registros</span>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="ios-card p-3">
                                <div class="text-secondary mb-1" style="font-size: 11px;"><i class="bi bi-activity"></i> Activas / Vigentes</div>
                                <h4 class="fw-bold text-success mb-0" style="font-size: 16px;">${activeQuotes}</h4>
                                <span class="text-muted" style="font-size: 9px;">${expiredQuotes} vencidas</span>
                            </div>
                        </div>
                    </div>

                    <div class="ios-card p-3 mb-3 text-white" style="background: linear-gradient(135deg, #0D6EFD 0%, #0A58CA 100%);">
                        <h6 class="fw-bold mb-1" style="font-size: 14px;">Nueva Propuesta de Software</h6>
                        <p class="text-white-50 mb-2" style="font-size: 11px;">Selecciona módulos fijos del catálogo, define precios en Bolivianos y genera reportes.</p>
                        <button class="btn btn-light btn-sm fw-semibold px-3 py-1 text-primary" style="font-size: 11px;" onclick="switchTab('newQuote')">
                            <i class="bi bi-plus-lg"></i> Crear Cotización
                        </button>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6 class="fw-bold text-dark mb-0" style="font-size: 13px;">Cotizaciones Recientes</h6>
                        <a href="#" class="text-primary text-decoration-none" style="font-size: 11px;" onclick="switchTab('quotes')">Ver todas</a>
                    </div>
                    <div>
                        ${recentHTML || '<p class="text-muted text-center py-3" style="font-size: 12px;">No hay cotizaciones registradas.</p>'}
                    </div>
                </div>
            `;
        }

        // --- QUOTES LIST ---
        function getQuotesListHTML() {
            const searchTerm = document.getElementById('searchQuoteInput')?.value?.toLowerCase() || '';
            const statusFilter = document.getElementById('statusFilterSelect')?.value || 'ALL';

            const filtered = appData.quotes.filter(q => {
                const matchSearch = q.clientName.toLowerCase().includes(searchTerm) || q.id.toLowerCase().includes(searchTerm);
                const matchStatus = statusFilter === 'ALL' || q.status === statusFilter;
                return matchSearch && matchStatus;
            });

            let listHTML = filtered.map(q => {
                const totals = calculateQuoteTotal(q);
                return `
                    <div class="ios-card p-3 mb-2">
                        <div class="d-flex justify-content-between align-items-start mb-1">
                            <div>
                                <span class="fw-bold text-primary" style="font-size: 12px;">${q.id}</span>
                                <h6 class="fw-bold text-dark mb-0" style="font-size: 14px;">${q.clientName}</h6>
                                <span class="text-secondary" style="font-size: 11px;">NIT: ${q.clientNit || 'S/N'}</span>
                            </div>
                            <span class="badge ${getStatusBadgeClass(q.status)}" style="font-size: 10px;">${q.status}</span>
                        </div>
                        <div class="my-2 text-secondary" style="font-size: 11px;">
                            <div><i class="bi bi-calendar-event"></i> Emisión: ${q.dateEmission} | Vence: <span class="${q.dateExpiry < new Date().toISOString().split('T')[0] && q.status !== 'Aprobada' ? 'text-danger fw-bold' : ''}">${q.dateExpiry}</span></div>
                            <div><i class="bi bi-layers"></i> ${q.modules.length} Módulos del catálogo</div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                            <div>
                                <span class="text-muted" style="font-size: 10px;">TOTAL BOB</span>
                                <div class="fw-bold text-dark" style="font-size: 14px;">Bs. ${totals.total.toLocaleString('es-BO', {minimumFractionDigits: 2})}</div>
                            </div>
                            <div class="btn-group btn-group-sm">
                                <button class="btn btn-outline-secondary py-1 px-2" style="font-size: 11px;" onclick="openPreview('${q.id}')" title="Ver / Imprimir">
                                    <i class="bi bi-printer"></i>
                                </button>
                                <button class="btn btn-outline-primary py-1 px-2" style="font-size: 11px;" onclick="editQuote('${q.id}')" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-outline-danger py-1 px-2" style="font-size: 11px;" onclick="deleteQuote('${q.id}')" title="Eliminar">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="p-1">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold m-0 text-dark" style="font-size: 15px;">Listado de Cotizaciones</h5>
                        <button class="btn btn-primary btn-sm rounded-pill px-3" style="font-size: 11px;" onclick="switchTab('newQuote')">
                            <i class="bi bi-plus-lg"></i> Nueva
                        </button>
                    </div>

                    <div class="mb-3">
                        <div class="input-group input-group-sm mb-2">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                            <input type="text" id="searchQuoteInput" class="form-control border-start-0" placeholder="Buscar cliente o código..." value="${searchTerm}" oninput="renderScreen()">
                        </div>
                        <select id="statusFilterSelect" class="form-select form-select-sm" onchange="renderScreen()">
                            <option value="ALL" ${statusFilter==='ALL'?'selected':''}>Todos los estados</option>
                            <option value="Borrador" ${statusFilter==='Borrador'?'selected':''}>Borrador</option>
                            <option value="Enviada" ${statusFilter==='Enviada'?'selected':''}>Enviada</option>
                            <option value="Aprobada" ${statusFilter==='Aprobada'?'selected':''}>Aprobada</option>
                            <option value="Rechazada" ${statusFilter==='Rechazada'?'selected':''}>Rechazada</option>
                        </select>
                    </div>

                    <div>
                        ${listHTML || '<div class="text-center py-5 text-muted" style="font-size: 12px;">No se encontraron cotizaciones.</div>'}
                    </div>
                </div>
            `;
        }

        // --- QUOTE BUILDER & EDITOR ---
        function initQuoteBuilder() {
            if(!editingQuoteId) {
                const count = appData.quotes.length + 1;
                const code = `COT-2026-${String(count).padStart(3, '0')}`;
                const today = new Date().toISOString().split('T')[0];
                const expiry = new Date(Date.now() + 30*24*60*60*1000).toISOString().split('T')[0];

                windowBuilder = {
                    id: code,
                    clientName: '',
                    clientNit: '',
                    clientEmail: '',
                    dateEmission: today,
                    dateExpiry: expiry,
                    status: 'Borrador',
                    discountPercent: 0,
                    modules: [],
                    notes: 'Forma de pago: 50% anticipo, 50% contra entrega de software funcionando.'
                };
            }
        }

        function getQuoteBuilderHTML() {
            const b = windowBuilder;
            let selectedModulesHTML = b.modules.map((m, idx) => `
                <div class="ios-card p-3 mb-2 border border-light">
                    <div class="d-flex justify-content-between align-items-start mb-1">
                        <div>
                            <span class="badge bg-secondary mb-1" style="font-size: 9px;">Módulo fijo #${idx+1}</span>
                            <h6 class="fw-bold text-dark mb-0" style="font-size: 13px;">${m.name}</h6>
                        </div>
                        <button class="btn btn-sm text-danger p-0" onclick="removeBuilderModule(${idx})"><i class="bi bi-x-circle-fill" style="font-size: 16px;"></i></button>
                    </div>
                    <p class="text-muted mb-2" style="font-size: 10px;">${m.description}</p>
                    
                    <div class="bg-light p-2 rounded mb-2 text-secondary" style="font-size: 10px;">
                        <strong>Pantallas:</strong> ${m.screens.join(', ')}<br>
                        <strong>Historias:</strong> ${m.userStories.join(' | ')}
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <span class="text-secondary" style="font-size: 11px;">Precio (BOB):</span>
                        <input type="number" class="form-control form-control-sm w-50 text-end fw-bold text-primary" value="${m.customPrice}" onchange="updateModulePrice(${idx}, this.value)">
                    </div>
                </div>
            `).join('');

            const totals = calculateQuoteTotal(b);

            let catalogOptions = FIXED_CATALOG.map(cat => `
                <option value="${cat.id}">${cat.name} (Bs. ${cat.price})</option>
            `).join('');

            return `
                <div class="p-1">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold m-0 text-dark" style="font-size: 15px;">${editingQuoteId ? 'Editar Cotización' : 'Nueva Cotización'}</h5>
                        <button class="btn btn-outline-secondary btn-sm py-0 px-2" style="font-size: 11px;" onclick="switchTab('quotes')">Cancelar</button>
                    </div>

                    <div class="ios-card p-3 mb-3">
                        <h6 class="fw-bold text-primary mb-2" style="font-size: 12px;"><i class="bi bi-person-badge"></i> Datos del Cliente y Validez</h6>
                        <div class="mb-2">
                            <label class="form-label text-secondary mb-1" style="font-size: 10px;">N° Cotización</label>
                            <input type="text" id="builderId" class="form-control form-control-sm bg-light fw-bold" value="${b.id}" readonly>
                        </div>
                        <div class="mb-2">
                            <label class="form-label text-secondary mb-1" style="font-size: 10px;">Nombre o Razón Social</label>
                            <input type="text" id="builderClientName" class="form-control form-control-sm" placeholder="Ej. Empresa S.R.L." value="${b.clientName}">
                        </div>
                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label class="form-label text-secondary mb-1" style="font-size: 10px;">NIT / CI</label>
                                <input type="text" id="builderClientNit" class="form-control form-control-sm" placeholder="Ej. 1029384" value="${b.clientNit}">
                            </div>
                            <div class="col-6">
                                <label class="form-label text-secondary mb-1" style="font-size: 10px;">Email Contacto</label>
                                <input type="email" id="builderClientEmail" class="form-control form-control-sm" placeholder="correo@empresa.bo" value="${b.clientEmail}">
                            </div>
                        </div>
                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label class="form-label text-secondary mb-1" style="font-size: 10px;">Fecha Emisión</label>
                                <input type="date" id="builderDateEmission" class="form-control form-control-sm" value="${b.dateEmission}">
                            </div>
                            <div class="col-6">
                                <label class="form-label text-secondary mb-1" style="font-size: 10px;">Fecha Límite Validez</label>
                                <input type="date" id="builderDateExpiry" class="form-control form-control-sm" value="${b.dateExpiry}">
                            </div>
                        </div>
                        <div>
                            <label class="form-label text-secondary mb-1" style="font-size: 10px;">Estado</label>
                            <select id="builderStatus" class="form-select form-select-sm">
                                <option value="Borrador" ${b.status==='Borrador'?'selected':''}>Borrador</option>
                                <option value="Enviada" ${b.status==='Enviada'?'selected':''}>Enviada</option>
                                <option value="Aprobada" ${b.status==='Aprobada'?'selected':''}>Aprobada</option>
                                <option value="Rechazada" ${b.status==='Rechazada'?'selected':''}>Rechazada</option>
                            </select>
                        </div>
                    </div>

                    <div class="ios-card p-3 mb-3">
                        <h6 class="fw-bold text-primary mb-2" style="font-size: 12px;"><i class="bi bi-stack"></i> Catálogo Fijo de Módulos (No Modificables)</h6>
                        
                        <div class="input-group input-group-sm mb-3">
                            <select id="catalogSelector" class="form-select form-select-sm">
                                <option value="">-- Seleccionar Módulo Fijo --</option>
                                ${catalogOptions}
                            </select>
                            <button class="btn btn-primary" type="button" onclick="addModuleFromCatalog()"><i class="bi bi-plus-lg"></i> Agregar</button>
                        </div>

                        <div id="selectedModulesContainer" class="mt-2">
                            ${selectedModulesHTML || '<p class="text-muted text-center py-2" style="font-size: 11px;">No hay módulos agregados a esta cotización.</p>'}
                        </div>
                    </div>

                    <div class="ios-card p-3 mb-3">
                        <h6 class="fw-bold text-primary mb-2" style="font-size: 12px;"><i class="bi bi-calculator"></i> Totales en Bolivianos (BOB) - Sin IVA</h6>
                        <div class="d-flex justify-content-between mb-1" style="font-size: 11px;">
                            <span class="text-secondary">Subtotal Módulos:</span>
                            <span class="fw-bold">Bs. ${totals.subtotal.toLocaleString('es-BO', {minimumFractionDigits: 2})}</span>
                        </div>
                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-6 text-secondary" style="font-size: 11px;">Descuento Global (%):</div>
                            <div class="col-6">
                                <input type="number" id="builderDiscount" class="form-control form-control-sm text-end" value="${b.discountPercent}" min="0" max="100" onchange="updateBuilderFinancials()">
                            </div>
                        </div>
                        <div class="d-flex justify-content-between pt-2 border-top">
                            <span class="fw-bold text-dark" style="font-size: 13px;">TOTAL GENERAL (BOB):</span>
                            <span class="fw-bold text-primary" style="font-size: 15px;">Bs. ${totals.total.toLocaleString('es-BO', {minimumFractionDigits: 2})}</span>
                        </div>
                    </div>

                    <div class="ios-card p-3 mb-3">
                        <label class="form-label text-secondary mb-1" style="font-size: 10px;">Términos y Notas Comerciales</label>
                        <textarea id="builderNotes" class="form-control form-control-sm" rows="3" style="font-size: 11px;">${b.notes}</textarea>
                    </div>

                    <div class="d-grid mb-4">
                        <button class="btn btn-primary fw-semibold py-2 rounded-pill" style="font-size: 13px;" onclick="saveCurrentQuote()">
                            <i class="bi bi-check2-circle"></i> Guardar Cotización
                        </button>
                    </div>
                </div>
            `;
        }

        function setupBuilderEvents() {
            document.getElementById('builderClientName')?.addEventListener('input', e => windowBuilder.clientName = e.target.value);
            document.getElementById('builderClientNit')?.addEventListener('input', e => windowBuilder.clientNit = e.target.value);
            document.getElementById('builderClientEmail')?.addEventListener('input', e => windowBuilder.clientEmail = e.target.value);
            document.getElementById('builderDateEmission')?.addEventListener('change', e => windowBuilder.dateEmission = e.target.value);
            document.getElementById('builderDateExpiry')?.addEventListener('change', e => windowBuilder.dateExpiry = e.target.value);
            document.getElementById('builderStatus')?.addEventListener('change', e => windowBuilder.status = e.target.value);
            document.getElementById('builderNotes')?.addEventListener('input', e => windowBuilder.notes = e.target.value);
        }

        function addModuleFromCatalog() {
            const select = document.getElementById('catalogSelector');
            const catId = select.value;
            if(!catId) return;

            const catalogItem = FIXED_CATALOG.find(c => c.id === catId);
            if(catalogItem) {
                windowBuilder.modules.push({
                    ...catalogItem,
                    customPrice: catalogItem.price
                });
                renderScreen();
            }
        }

        function removeBuilderModule(idx) {
            windowBuilder.modules.splice(idx, 1);
            renderScreen();
        }

        function updateModulePrice(idx, val) {
            windowBuilder.modules[idx].customPrice = parseFloat(val) || 0;
            renderScreen();
        }

        function updateBuilderFinancials() {
            windowBuilder.discountPercent = parseFloat(document.getElementById('builderDiscount').value) || 0;
            renderScreen();
        }

        function saveCurrentQuote() {
            const b = windowBuilder;
            if(!b.clientName.trim()) {
                alert('Ingrese el nombre o razón social del cliente.');
                return;
            }
            if(b.modules.length === 0) {
                alert('Debe agregar al menos un módulo de software.');
                return;
            }

            const existingIdx = appData.quotes.findIndex(q => q.id === b.id);
            if(existingIdx >= 0) {
                appData.quotes[existingIdx] = { ...b };
            } else {
                appData.quotes.push({ ...b });
            }

            saveState();
            editingQuoteId = null;
            switchTab('quotes');
        }

        function editQuote(id) {
            const q = appData.quotes.find(item => item.id === id);
            if(q) {
                editingQuoteId = id;
                windowBuilder = JSON.parse(JSON.stringify(q));
                currentTab = 'newQuote';
                renderScreen();
            }
        }

        function deleteQuote(id) {
            if(confirm(`¿Está seguro de eliminar la cotización ${id}?`)) {
                appData.quotes = appData.quotes.filter(q => q.id !== id);
                saveState();
                renderScreen();
            }
        }

        // --- REPORTS & EXECUTIVE PDF PRINT VIEW ---
        function getReportsHTML() {
            const totalQuotes = appData.quotes.length;
            const approved = appData.quotes.filter(q => q.status === 'Aprobada').length;
            const pending = appData.quotes.filter(q => q.status === 'Enviada' || q.status === 'Borrador').length;
            const totalRevenueApproved = appData.quotes.filter(q => q.status === 'Aprobada').reduce((acc, q) => acc + calculateQuoteTotal(q).total, 0);

            let tableRows = appData.quotes.map(q => {
                const totals = calculateQuoteTotal(q);
                return `
                    <tr>
                        <td style="font-size: 11px;" class="fw-bold">${q.id}</td>
                        <td style="font-size: 11px;">${q.clientName}</td>
                        <td style="font-size: 11px;"><span class="badge ${getStatusBadgeClass(q.status)}">${q.status}</span></td>
                        <td style="font-size: 11px;" class="text-end fw-bold">Bs. ${totals.total.toLocaleString('es-BO', {minimumFractionDigits: 2})}</td>
                        <td style="font-size: 11px;" class="text-center">
                            <button class="btn btn-sm btn-outline-primary py-0 px-1" onclick="openPreview('${q.id}')"><i class="bi bi-eye"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');

            return `
                <div class="p-1">
                    <h5 class="fw-bold mb-3 text-dark" style="font-size: 15px;">Reportes & Consolidado BOB</h5>
                    
                    <div class="ios-card p-3 mb-3">
                        <h6 class="fw-bold text-primary mb-2" style="font-size: 12px;"><i class="bi bi-graph-up"></i> Resumen de Ingresos</h6>
                        <div class="d-flex justify-content-between mb-1" style="font-size: 11px;">
                            <span class="text-secondary">Total Cotizaciones:</span>
                            <span class="fw-bold">${totalQuotes}</span>
                        </div>
                        <div class="d-flex justify-content-between mb-1" style="font-size: 11px;">
                            <span class="text-secondary">Aprobadas:</span>
                            <span class="fw-bold text-success">${approved}</span>
                        </div>
                        <div class="d-flex justify-content-between mb-1" style="font-size: 11px;">
                            <span class="text-secondary">Pendientes:</span>
                            <span class="fw-bold text-warning">${pending}</span>
                        </div>
                        <div class="d-flex justify-content-between pt-2 border-top" style="font-size: 12px;">
                            <span class="fw-bold text-dark">Ingresos Aprobados (BOB):</span>
                            <span class="fw-bold text-primary">Bs. ${totalRevenueApproved.toLocaleString('es-BO', {minimumFractionDigits: 2})}</span>
                        </div>
                    </div>

                    <div class="ios-card p-3 mb-3">
                        <h6 class="fw-bold text-primary mb-2" style="font-size: 12px;"><i class="bi bi-table"></i> Listado General</h6>
                        <div class="table-responsive">
                            <table class="table table-sm table-striped align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th style="font-size: 10px;">Código</th>
                                        <th style="font-size: 10px;">Cliente</th>
                                        <th style="font-size: 10px;">Estado</th>
                                        <th style="font-size: 10px;" class="text-end">Total</th>
                                        <th style="font-size: 10px;" class="text-center">Ver</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${tableRows || '<tr><td colspan="5" class="text-center text-muted py-3" style="font-size: 11px;">Sin datos registrados.</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- PREVIEW / PRINT PDF ---
        function openPreview(id) {
            previewingQuoteId = id;
            currentTab = 'preview';
            renderScreen();
        }

        function getQuotePreviewHTML(id) {
            const q = appData.quotes.find(item => item.id === id);
            if(!q) return `<div class="p-4 text-center">Cotización no encontrada. <button class="btn btn-primary btn-sm mt-2" onclick="switchTab('quotes')">Volver</button></div>`;

            const totals = calculateQuoteTotal(q);
            const comp = appData.settings;

            let modulesHTML = q.modules.map((m, idx) => `
                <div class="mb-3 pb-2 border-bottom">
                    <div class="d-flex justify-content-between">
                        <span class="fw-bold" style="font-size: 12px; color: #111;">${idx+1}. ${m.name}</span>
                        <span class="fw-bold" style="font-size: 12px; color: #111;">Bs. ${(m.customPrice || m.price).toLocaleString('es-BO', {minimumFractionDigits: 2})}</span>
                    </div>
                    <div style="font-size: 11px; color: #555;" class="mb-1">${m.description}</div>
                    <div style="font-size: 10px; color: #666;" class="bg-light p-1 rounded">
                        <strong>Pantallas:</strong> ${m.screens.join(', ')}<br>
                        <strong>Historias de Usuario:</strong> ${m.userStories.join(' | ')}
                    </div>
                </div>
            `).join('');

            return `
                <div class="p-2 print-container bg-white" style="min-height: 100%;">
                    <div class="d-flex justify-content-between align-items-center mb-3 no-print">
                        <button class="btn btn-outline-secondary btn-sm" onclick="switchTab('quotes')"><i class="bi bi-arrow-left"></i> Volver</button>
                        <button class="btn btn-primary btn-sm" onclick="window.print()"><i class="bi bi-printer"></i> Imprimir / Guardar PDF</button>
                    </div>

                    <div class="text-center border-bottom pb-3 mb-3">
                        <div class="fw-bold text-primary" style="font-size: 16px; letter-spacing: 0.5px;">${comp.companyName}</div>
                        <div style="font-size: 10px; color: #666;">Desarrollo de Software a Medida & Arquitectura Cloud</div>
                        <div style="font-size: 10px; color: #666;">Tel: ${comp.companyPhone} | Email: ${comp.companyEmail} | ${comp.companyNit}</div>
                    </div>

                    <div class="row mb-3" style="font-size: 11px;">
                        <div class="col-7">
                            <strong style="color: #333;">CLIENTE:</strong><br>
                            <span class="fw-bold text-dark" style="font-size: 13px;">${q.clientName}</span><br>
                            <span>NIT / CI: ${q.clientNit || 'S/N'}</span><br>
                            <span>Email: ${q.clientEmail || 'N/A'}</span>
                        </div>
                        <div class="col-5 text-end">
                            <strong style="color: #333;">PROPUESTA:</strong><br>
                            <span class="fw-bold text-primary" style="font-size: 13px;">${q.id}</span><br>
                            <span>Emisión: ${q.dateEmission}</span><br>
                            <span class="fw-bold text-danger">Validez: ${q.dateExpiry}</span><br>
                            <span>Estado: <strong>${q.status}</strong></span>
                        </div>
                    </div>

                    <div class="mb-3">
                        <h6 class="fw-bold border-bottom pb-1 text-dark" style="font-size: 12px; text-transform: uppercase;">1. Arquitectura & Módulos Solicitados</h6>
                        ${modulesHTML}
                    </div>

                    <div class="mb-3">
                        <h6 class="fw-bold border-bottom pb-1 text-dark" style="font-size: 12px; text-transform: uppercase;">2. Resumen Económico ( Bolivianos - BOB )</h6>
                        <table class="table table-sm table-borderless mb-0" style="font-size: 11px;">
                            <tr>
                                <td>Subtotal Módulos Software:</td>
                                <td class="text-end fw-bold">Bs. ${totals.subtotal.toLocaleString('es-BO', {minimumFractionDigits: 2})}</td>
                            </tr>
                            ${q.discountPercent > 0 ? `
                            <tr>
                                <td>Descuento Comercial (${q.discountPercent}%):</td>
                                <td class="text-end text-success">- Bs. ${totals.discountAmount.toLocaleString('es-BO', {minimumFractionDigits: 2})}</td>
                            </tr>` : ''}
                            <tr class="border-top fw-bold" style="font-size: 13px;">
                                <td class="pt-2">TOTAL GENERAL (BOB):</td>
                                <td class="text-end pt-2 text-primary">Bs. ${totals.total.toLocaleString('es-BO', {minimumFractionDigits: 2})}</td>
                            </tr>
                        </table>
                    </div>

                    <div class="mb-4 bg-light p-2 rounded" style="font-size: 10px;">
                        <strong class="text-dark">Términos y Condiciones:</strong>
                        <p class="mb-0 text-secondary">${q.notes}</p>
                    </div>

                    <div class="row text-center mt-5 pt-4" style="font-size: 10px;">
                        <div class="col-6">
                            <div class="border-top pt-1 mx-3" style="border-color: #999 !important;">Aprobado Cliente</div>
                        </div>
                        <div class="col-6">
                            <div class="border-top pt-1 mx-3" style="border-color: #999 !important;">${comp.companyName}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- SETTINGS VIEW ---
        function getSettingsHTML() {
            const s = appData.settings;
            return `
                <div class="p-1">
                    <h5 class="fw-bold mb-3 text-dark" style="font-size: 15px;">Ajustes de Empresa</h5>

                    <div class="ios-card p-3 mb-3">
                        <h6 class="fw-bold text-primary mb-2" style="font-size: 12px;"><i class="bi bi-building"></i> Configurar Datos del Emisor</h6>
                        <div class="mb-2">
                            <label class="form-label text-secondary" style="font-size: 10px;">Nombre de la Empresa</label>
                            <input type="text" id="setCompanyName" class="form-control form-control-sm" value="${s.companyName}">
                        </div>
                        <div class="mb-2">
                            <label class="form-label text-secondary" style="font-size: 10px;">NIT / Datos Fiscales</label>
                            <input type="text" id="setCompanyNit" class="form-control form-control-sm" value="${s.companyNit}">
                        </div>
                        <div class="mb-2">
                            <label class="form-label text-secondary" style="font-size: 10px;">Teléfono</label>
                            <input type="text" id="setCompanyPhone" class="form-control form-control-sm" value="${s.companyPhone}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-secondary" style="font-size: 10px;">Correo Electrónico</label>
                            <input type="email" id="setCompanyEmail" class="form-control form-control-sm" value="${s.companyEmail}">
                        </div>
                        <button class="btn btn-primary btn-sm w-100" style="font-size: 12px;" onclick="saveCompanySettings()">
                            <i class="bi bi-check2"></i> Guardar Ajustes
                        </button>
                    </div>

                    <div class="ios-card p-3 mb-3">
                        <h6 class="fw-bold text-danger mb-2" style="font-size: 12px;"><i class="bi bi-shield-lock"></i> Catálogo Fijo</h6>
                        <p class="text-muted" style="font-size: 10px; margin-bottom: 8px;">Los módulos del sistema se mantienen fijos e imperturbables para garantizar la consistencia en el desglose de pantallas e historias de usuario.</p>
                        <div class="text-secondary" style="font-size: 11px;">
                            <strong>Módulos activos:</strong> ${FIXED_CATALOG.length} módulos estándar preconfigurados.
                        </div>
                    </div>
                </div>
            `;
        }

        function saveCompanySettings() {
            appData.settings.companyName = document.getElementById('setCompanyName').value.trim() || DEFAULT_SETTINGS.companyName;
            appData.settings.companyNit = document.getElementById('setCompanyNit').value.trim() || DEFAULT_SETTINGS.companyNit;
            appData.settings.companyPhone = document.getElementById('setCompanyPhone').value.trim() || DEFAULT_SETTINGS.companyPhone;
            appData.settings.companyEmail = document.getElementById('setCompanyEmail').value.trim() || DEFAULT_SETTINGS.companyEmail;

            saveState();
            updateHeaderDisplay();
            alert('¡Ajustes guardados correctamente!');
            switchTab('dashboard');
        }

        // --- CALCULATION HELPER (NO IVA) ---
        function calculateQuoteTotal(q) {
            const subtotal = q.modules.reduce((acc, m) => acc + (m.customPrice !== undefined ? m.customPrice : m.price), 0);
            const discountAmount = subtotal * ((q.discountPercent || 0) / 100);
            const total = subtotal - discountAmount;
            return { subtotal, discountAmount, total: total < 0 ? 0 : total };
        }

        function getStatusBadgeClass(status) {
            switch(status) {
                case 'Borrador': return 'badge-draft';
                case 'Enviada': return 'badge-sent';
                case 'Aprobada': return 'badge-approved';
                case 'Rechazada': return 'badge-rejected';
                default: return 'badge-draft';
            }
        }
    </script>
</body>
</html>
